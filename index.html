<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Athulyam Homes</title>
<meta name="description" content="Athulyam Homes Guest Manager — bookings, payments and reports, offline.">
<meta name="theme-color" content="#1e3a2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Athulyam">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --green:#1e3a2b; --green2:#2c5440; --gold:#b8955a; --gold-soft:#efe4cf; --bg:#f4f2ec; --card:#fff;
  --ink:#1d241f; --muted:#68716a; --line:#e6e2d8; --red:#b3402f; --red-soft:#f8e3df; --amber:#9a6a12; --amber-soft:#fbf0d9;
  --ok:#2f6b45; --ok-soft:#e1efe5; --r:14px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans)}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
a{color:var(--green2)}
header{position:sticky;top:0;z-index:5;background:var(--green);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 12px 12px;display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--gold)}
header h1{flex:1;margin:0;font:600 19px/1.2 var(--serif);letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#back{background:none;border:0;color:var(--gold-soft);font-size:28px;line-height:1;padding:0 8px 2px 2px;min-width:36px;min-height:36px}
#net{background:var(--gold);color:var(--green);font-size:12px;font-weight:700;border-radius:20px;padding:3px 9px}
main{max-width:640px;margin:0 auto;padding:12px 14px 24px}
h2{font:600 17px/1.3 var(--serif);margin:22px 2px 8px;display:flex;justify-content:space-between;align-items:baseline;color:var(--green)}
h2 .more{font:500 14px var(--sans);text-decoration:none;color:var(--gold)}
h3{margin:0 0 10px;font:600 16px/1.3 var(--serif);color:var(--green);display:flex;gap:8px;align-items:center}
.card{display:block;background:var(--card);border-radius:var(--r);padding:14px;margin:0 0 10px;border:1px solid var(--line);color:inherit;text-decoration:none;box-shadow:0 1px 2px rgba(30,58,43,.04)}
.today-line{color:var(--muted);font-size:14px;margin:2px 2px 10px}
.cta{display:block;text-align:center;background:var(--green);color:#fff;text-decoration:none;font-weight:700;font-size:17px;padding:16px;border-radius:var(--r);margin:6px 0 4px;border-bottom:3px solid var(--gold)}
.cta.small{padding:12px;font-size:15px;margin:10px 0}
.cta.alt{background:#fff;color:var(--green);border:1px solid var(--green);border-bottom:3px solid var(--gold)}
.tile.warnv .tv{color:var(--amber)}
.tiles{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.tile .tl{font-size:12.5px;color:var(--muted)}
.tile .tv{font:700 22px/1.25 var(--sans);font-variant-numeric:tabular-nums;color:var(--green);margin-top:2px;word-break:break-word}
.tile .ts{font-size:12px;color:var(--muted);margin-top:2px}
.tile.neg .tv{color:var(--red)}
.bk-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.bk-top b{font-size:16px}.bk-top .name{font:600 20px var(--serif)}
.bk-mid{color:var(--muted);font-size:14px;margin-top:3px}
.bk-bot{display:flex;justify-content:space-between;gap:6px;margin-top:8px;font-size:13.5px;font-variant-numeric:tabular-nums;border-top:1px solid var(--line);padding-top:8px}
.due{color:var(--red);font-weight:700}
.st{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap}
.st-enquiry{background:#ecebe7;color:#5d5a52}.st-confirmed{background:var(--gold-soft);color:#7a5a20}
.st-checked-in{background:var(--ok-soft);color:var(--ok)}.st-checked-out{background:#e4e9ee;color:#41546a}.st-cancelled{background:var(--red-soft);color:var(--red)}
.flag{display:inline-block;margin-top:8px;margin-right:6px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px}
.fl-overdue,.fl-refund-due{background:var(--red-soft);color:var(--red)}.fl-no-advance,.fl-pending,.fl-fee-due,.fl-due-today{background:var(--amber-soft);color:var(--amber)}.fl-overpaid{background:#e4e9ee;color:#41546a}
.alert{display:block;padding:11px 12px;border-radius:10px;margin:0 0 8px;font-size:14px;font-weight:600;text-decoration:none}
.alert.red{background:var(--red-soft);color:var(--red)}.alert.amber{background:var(--amber-soft);color:var(--amber)}.alert.grey{background:#eceae4;color:#555}
.alertcard{border-color:var(--red);background:#fffaf9}
.empty{text-align:center;color:var(--muted);padding:18px 10px;background:var(--card);border:1px dashed var(--line);border-radius:var(--r);margin-bottom:10px}
.empty p{margin:4px 0 10px}.leaf{color:var(--gold);font-size:22px}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:15px;border-bottom:1px dashed #efece4}
.row:last-child{border-bottom:0}.row b{font-variant-numeric:tabular-nums;text-align:right}
.row.strong{font-weight:700}.row.strong span{font-weight:700}.row.muted{color:var(--muted)}.row.due b{color:var(--red)}
hr{border:0;border-top:1px solid var(--line);margin:8px 0}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px;text-align:center}
.big3 small{display:block;color:var(--muted);font-size:12px}.big3 b{font-size:18px;font-variant-numeric:tabular-nums}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--green);font:600 15px var(--sans);text-decoration:none;cursor:pointer}
.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}
.btn.danger{color:var(--red);border-color:#e9c3bb;background:#fff}
.btn.wa{border-color:#bfe2c8;color:#1d6b37}
.btn.big{width:100%;min-height:52px;font-size:17px;margin:4px 0 10px}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
form .btn.danger{width:100%}
.link{background:none;border:0;color:var(--gold);font:600 14px var(--sans);padding:4px 0 10px;text-decoration:underline;display:inline-block;cursor:pointer}
.fld{display:block;margin:0 0 12px}
.fld>span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.fld small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
input,select,textarea{width:100%;font:16px var(--sans);color:var(--ink);background:#fbfaf7;border:1px solid #d9d4c7;border-radius:10px;padding:11px 12px;min-height:46px;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);border-color:var(--gold)}
input[type=checkbox],input[type=radio]{width:22px;height:22px;min-height:0;padding:0;accent-color:var(--green);-webkit-appearance:auto;appearance:auto;flex:none}
.chk{display:flex;align-items:center;gap:10px;margin:6px 0 12px;font-size:15px}
.chk.sm{margin:0;font-size:13px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.two>*,.three>*{min-width:0}
input[type=date],input[type=month]{min-width:0;display:block;max-width:100%}
.hide{display:none!important}
.err{display:block;color:var(--red);font-style:normal;font-size:13px;margin-top:4px;font-weight:600}
.warn{background:var(--red-soft);color:var(--red);padding:10px 12px;border-radius:10px;font-size:14px;margin:6px 0 10px}
.warn .chk{color:var(--ink);margin:10px 0 0}
.ok{background:var(--ok-soft);color:var(--ok);padding:10px 12px;border-radius:10px;font-size:14px;margin:6px 0 10px}
.nights{color:var(--gold);font-weight:700;margin:-4px 0 10px;font-size:14px}
.calcbox{background:#f9f7f1;border-radius:10px;padding:8px 12px;margin-top:6px}
.searchbar input{background:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 8px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 12px;font:600 13px var(--sans);color:var(--muted);min-height:36px}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
select.inline{background-color:#fff;margin-bottom:2px}
.count{color:var(--muted);font-size:13px;margin:4px 2px 8px}
.pay{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.pay:last-child{border-bottom:0}.pay small{color:var(--muted)}
.card.pay{padding:12px 14px;border-bottom:1px solid var(--line)}
.x{background:none;border:0;color:var(--muted);font-size:18px;min-width:40px;min-height:40px}
.tag{font-size:11px;background:var(--red-soft);color:var(--red);padding:1px 6px;border-radius:6px}
.pill{font:600 12px var(--sans);background:var(--gold-soft);color:#7a5a20;padding:2px 8px;border-radius:20px}
.small{font-size:13.5px;color:var(--muted)}.center{text-align:center}
.navrow b{display:block;font-size:16px}.navrow small{color:var(--muted)}
.navrow::after{content:"›";float:right;margin-top:-22px;color:var(--gold);font-size:22px}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin:2px 0 10px}
.monthbar b{font:600 17px var(--serif);color:var(--green)}
.calwrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r);-webkit-overflow-scrolling:touch}
.cal{border-collapse:collapse;font-size:11px}
.cal th,.cal td{border:1px solid #efece4;min-width:34px;height:38px;text-align:center;padding:0}
.cal th{background:#faf8f3;color:var(--muted);font-weight:600;height:28px}
.cal th.tday{background:var(--gold);color:#fff}
.cal .rn{position:sticky;left:0;background:#fff;min-width:78px;max-width:90px;text-align:left;padding:0 6px;font-weight:600;font-size:12px;z-index:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal td a{display:block;width:100%;height:100%;line-height:38px;text-decoration:none;color:inherit;font-weight:700;overflow:hidden;white-space:nowrap}
.cal td.occ.st-confirmed{background:var(--gold-soft)}.cal td.occ.st-checked-in{background:#cfe5d6}.cal td.occ.st-checked-out{background:#dde3ea}.cal td.occ.st-enquiry{background:#ecebe7}.cal td.clash{background:#f2c2b8}
.legend{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lg{display:inline-block;width:12px;height:12px;border-radius:3px;margin-left:4px}
.lg.st-confirmed{background:var(--gold-soft)}.lg.st-checked-in{background:#cfe5d6}.lg.st-checked-out{background:#dde3ea}.lg.st-enquiry{background:#ecebe7}.lg.clash{background:#f2c2b8}
.roomrow{display:flex;justify-content:space-between;align-items:center;gap:10px}.roomrow small{color:var(--muted)}
.roomedit{display:grid;grid-template-columns:1.4fr 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
.season{border:1px dashed var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.season .two{margin-bottom:8px}
.inline2{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center;margin:0 0 6px}.inline2>span{margin:0}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;color:var(--muted);font-weight:600;font-size:12.5px;border-bottom:1px solid var(--line);padding:6px 4px}
.tbl td{padding:7px 4px;border-bottom:1px dashed #efece4}.tbl .r,.tbl td:not(:first-child){text-align:right}
.tbl tr.strong td{font-weight:700;border-top:1px solid var(--ink)}
.lock{text-align:center;margin-top:40px}.lock input{text-align:center;font-size:24px;letter-spacing:8px;margin:10px 0}
.bill{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px}
.bill-h{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid var(--gold);padding-bottom:10px;margin-bottom:10px}
.bill-brand{font:700 22px var(--serif);color:var(--green)}.bill-h .r{text-align:right}.bill-g{font-size:14px;margin-bottom:10px}
.printhead{display:none}
#tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
#tabs a{flex:1;min-width:0;text-align:center;text-decoration:none;color:var(--muted);font-size:10.5px;font-weight:600;padding:8px 0 7px;min-height:56px}
#tabs a i{display:block;font-style:normal;font-size:20px;line-height:24px}
#tabs a.on{color:var(--green)}#tabs a.on i{color:var(--gold)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--green);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;z-index:9}
#toast.show{opacity:1;transform:translateX(-50%)}#toast.bad{background:var(--red)}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.anhead{background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:var(--r);padding:12px 14px;margin:0 0 10px;font-size:15px}
.chg{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 6px;border-radius:6px;background:#eceae4;color:#555}
.chg.good{background:var(--ok-soft);color:var(--ok)}.chg.bad{background:var(--red-soft);color:var(--red)}
.chart h3{margin-bottom:12px}
.brow{display:grid;grid-template-columns:minmax(0,34%) minmax(0,1fr);gap:8px;align-items:center;margin:0 0 10px;font-size:13px}
.blab{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.bbars{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 6px;align-items:center}
.bar{height:12px;border-radius:0 4px 4px 0;min-width:2px}.bar.a{background:var(--green)}.bar.b{background:var(--gold)}
.bval{font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}.bval.muted{color:var(--muted)}
.legend2{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
.sw{display:inline-block;width:12px;height:10px;border-radius:2px}.sw.a{background:var(--green)}.sw.b{background:var(--gold)}
.lsvg{width:100%;height:auto;display:block}.lsvg .la{fill:none;stroke:var(--green);stroke-width:2.2}.lsvg .lb{fill:none;stroke:var(--gold);stroke-width:2;stroke-dasharray:4 3}
.lsvg .gl{stroke:#e6e2d8;stroke-width:1}.lsvg .ax{font-size:9px;fill:#68716a;font-family:var(--sans)}
.roomline{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 40px;gap:8px;align-items:center;margin-bottom:8px}
.guestrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px dashed var(--line);text-decoration:none;color:inherit}
.guestrow small{color:var(--muted)}.guestrow .flag{margin-top:4px}.chev{color:var(--gold);font-size:22px}
.tag2{font-size:11px;font-weight:700;background:var(--gold-soft);color:#7a5a20;padding:1px 6px;border-radius:6px}
.filebtn{position:relative;overflow:hidden}.filebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;min-height:0;cursor:pointer}
.docgrid{display:grid;gap:10px;margin-top:6px}
.doc{display:grid;grid-template-columns:64px minmax(0,1fr);grid-template-areas:'t m' 't a';gap:4px 10px;border:1px solid var(--line);border-radius:10px;padding:8px}
.thumb{grid-area:t;width:64px;height:64px;border-radius:8px;background:#eceae4;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:12px;font-weight:700;color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover}.dmeta{grid-area:m}.dmeta small{display:block;color:var(--muted)}.dact{grid-area:a;display:flex;gap:6px;flex-wrap:wrap}
.fcard{padding:6px 14px}.fcsec{font:600 13px var(--sans);color:var(--gold);text-transform:uppercase;letter-spacing:.4px;margin:12px 0 2px}
.fcrow{display:grid;grid-template-columns:minmax(0,40%) minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed #efece4;font-size:14px}
.fcrow b{word-break:break-word}.muted{color:var(--muted);font-weight:400}
@media (max-width:360px){.tiles{grid-template-columns:1fr}.three{grid-template-columns:1fr 1fr}}
@media print{
  header,#tabs,#toast,.noprint,.cta,.alert{display:none!important}
  body{background:#fff;padding:0}main{max-width:none;padding:0}
  .card,.tile,.bill,.chart,.anhead{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  .bar.a{background:#1e3a2b!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.bar.b,.sw.b{background:#b8955a!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.sw.a{background:#1e3a2b!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tiles{grid-template-columns:repeat(4,1fr)}
  .lsvg{max-height:230px}
  .printhead{display:block;font:700 18px var(--serif);margin-bottom:10px;color:#000}
  .tile .tv{font-size:16px}
}
</style>
</head>
<body>
<header>
  <button id="back" aria-label="Back">‹</button>
  <h1 id="title">Athulyam Homes</h1>
  <span id="net" hidden>Offline</span>
</header>
<main id="main"><div class="empty"><div class="leaf">❦</div><p>Loading…</p></div></main>
<nav id="tabs">
  <a href="#/home" data-tab="home"><i>⌂</i>Home</a>
  <a href="#/queries" data-tab="queries"><i>?</i>Queries</a>
  <a href="#/bookings" data-tab="bookings"><i>☰</i>Bookings</a>
  <a href="#/calendar" data-tab="calendar"><i>▦</i>Rooms</a>
  <a href="#/reports" data-tab="reports"><i>₹</i>Reports</a>
  <a href="#/more" data-tab="more"><i>⋯</i>More</a>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>Please turn on JavaScript to use this app.</noscript>
<script src="logic.js"></script>
<script src="xlsx.js"></script>
<script src="app.js"></script>
</body>
</html>
