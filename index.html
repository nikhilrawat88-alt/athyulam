*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans)}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
a{color:var(--green2)}
header{position:sticky;top:0;z-index:5;background:var(--green);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 12px 12px;display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--gold)}

#back{background:none;border:0;color:var(--gold-soft);font-size:28px;line-height:1;padding:0 8px 2px 2px;min-width:36px;min-height:36px}
#net{background:var(--gold);color:var(--green);font-size:12px;font-weight:700;border-radius:20px;padding:3px 9px}
main{max-width:640px;margin:0 auto;padding:12px 14px 24px}
h2{font:600 17px/1.3 var(--serif);margin:22px 2px 8px;display:flex;justify-content:space-between;align-items:baseline;color:var(--green)}

h3{margin:0 0 10px;font:600 16px/1.3 var(--serif);color:var(--green);display:flex;gap:8px;align-items:center}
.card{display:block;background:var(--card);border-radius:var(--r);padding:14px;margin:0 0 10px;border:1px solid var(--line);color:inherit;text-decoration:none;box-shadow:0 1px 2px rgba(30,58,43,.04)}
.today-line{color:var(--muted);font-size:14px;margin:2px 2px 10px}
.cta{display:block;text-align:center;background:var(--green);color:#fff;text-decoration:none;font-weight:700;font-size:17px;padding:16px;border-radius:var(--r);margin:6px 0 4px;border-bottom:3px solid var(--gold)}
.cta.small{padding:12px;font-size:15px;margin:10px 0}
.cta.alt{background:var(--card);color:var(--green);border:1px solid var(--green);border-bottom:3px solid var(--gold)}
.tile.warnv .tv{color:var(--amber)}
.tiles{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.tile .tl{font-size:12.5px;color:var(--muted)}
.tile .tv{font:700 22px/1.25 var(--sans);font-variant-numeric:tabular-nums;color:var(--green);margin-top:2px;word-break:break-word}
.tile .ts{font-size:12px;color:var(--muted);margin-top:2px}
.tile.neg .tv{color:var(--red)}
.bk-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.bk-top b{font-size:16px}.bk-top .name{font:600 20px var(--serif)}
.bk-mid{color:var(--muted);font-size:14px;margin-top:3px}
.bk-bot{display:flex;justify-content:space-between;gap:6px;margin-top:8px;font-size:13.5px;font-variant-numeric:tabular-nums;border-top:1px solid var(--line);padding-top:8px}
.due{color:var(--red);font-weight:700}
.st{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap}
.st-enquiry{background:#ecebe7;color:#5d5a52}.st-confirmed{background:var(--gold-soft);color:#7a5a20}
.st-checked-in{background:var(--ok-soft);color:var(--ok)}.st-checked-out{background:#e4e9ee;color:#41546a}.st-cancelled{background:var(--red-soft);color:var(--red)}
.flag{display:inline-block;margin-top:8px;margin-right:6px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px}
.fl-overdue,.fl-refund-due{background:var(--red-soft);color:var(--red)}.fl-no-advance,.fl-pending,.fl-fee-due,.fl-due-today{background:var(--amber-soft);color:var(--amber)}.fl-overpaid{background:#e4e9ee;color:#41546a}
.alert{display:block;padding:11px 12px;border-radius:10px;margin:0 0 8px;font-size:14px;font-weight:600;text-decoration:none}
.alert.red{background:var(--red-soft);color:var(--red)}.alert.amber{background:var(--amber-soft);color:var(--amber)}.alert.grey{background:#eceae4;color:#555}

.empty{text-align:center;color:var(--muted);padding:18px 10px;background:var(--card);border:1px dashed var(--line);border-radius:var(--r);margin-bottom:10px}

.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:15px;border-bottom:1px dashed var(--line2)}
.row:last-child{border-bottom:0}.row b{font-variant-numeric:tabular-nums;text-align:right}
.row.strong{font-weight:700}.row.strong span{font-weight:700}.row.muted{color:var(--muted)}.row.due b{color:var(--red)}
hr{border:0;border-top:1px solid var(--line);margin:8px 0}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px;text-align:center}
.big3 small{display:block;color:var(--muted);font-size:12px}.big3 b{font-size:18px;font-variant-numeric:tabular-nums}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--green);font:600 15px var(--sans);text-decoration:none;cursor:pointer}
.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}
.btn.danger{color:var(--red);border-color:#e9c3bb;background:var(--card)}
.btn.wa{border-color:#bfe2c8;color:#1d6b37}
.btn.big{width:100%;min-height:52px;font-size:17px;margin:4px 0 10px}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
form .btn.danger{width:100%}
.link{background:none;border:0;color:var(--gold);font:600 14px var(--sans);padding:4px 0 10px;text-decoration:underline;display:inline-block;cursor:pointer}
.fld{display:block;margin:0 0 12px}
.fld>span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.fld small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
input,select,textarea{width:100%;font:16px var(--sans);color:var(--ink);background:var(--field);border:1px solid var(--line3);border-radius:10px;padding:11px 12px;min-height:46px;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);border-color:var(--gold)}
input[type=checkbox],input[type=radio]{width:22px;height:22px;min-height:0;padding:0;accent-color:var(--green);-webkit-appearance:auto;appearance:auto;flex:none}
.chk{display:flex;align-items:center;gap:10px;margin:6px 0 12px;font-size:15px}
.chk.sm{margin:0;font-size:13px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.two>*,.three>*{min-width:0}
input[type=date],input[type=month]{min-width:0;display:block;max-width:100%}
.hide{display:none!important}
.err{display:block;color:var(--red);font-style:normal;font-size:13px;margin-top:4px;font-weight:600}
.warn{background:var(--red-soft);color:var(--red);padding:10px 12px;border-radius:10px;font-size:14px;margin:6px 0 10px}
.warn .chk{color:var(--ink);margin:10px 0 0}
.ok{background:var(--ok-soft);color:var(--ok);padding:10px 12px;border-radius:10px;font-size:14px;margin:6px 0 10px}
.nights{color:var(--gold);font-weight:700;margin:-4px 0 10px;font-size:14px}
.calcbox{background:var(--soft);border-radius:10px;padding:8px 12px;margin-top:6px}
.searchbar input{background:var(--card)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 8px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:7px 12px;font:600 13px var(--sans);color:var(--muted);min-height:36px}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
select.inline{background-color:var(--card);margin-bottom:2px}
.count{color:var(--muted);font-size:13px;margin:4px 2px 8px}
.pay{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.pay:last-child{border-bottom:0}.pay small{color:var(--muted)}
.card.pay{padding:12px 14px;border-bottom:1px solid var(--line)}
.x{background:none;border:0;color:var(--muted);font-size:18px;min-width:40px;min-height:40px}
.tag{font-size:11px;background:var(--red-soft);color:var(--red);padding:1px 6px;border-radius:6px}
.pill{font:600 12px var(--sans);background:var(--gold-soft);color:#7a5a20;padding:2px 8px;border-radius:20px}
.small{font-size:13.5px;color:var(--muted)}.center{text-align:center}
.navrow b{display:block;font-size:16px}.navrow small{color:var(--muted)}
.navrow::after{content:"›";float:right;margin-top:-22px;color:var(--gold);font-size:22px}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin:2px 0 10px}
.monthbar b{font:600 17px var(--serif);color:var(--green)}
.calwrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);-webkit-overflow-scrolling:touch}
.cal{border-collapse:collapse;font-size:11px}

.cal td a{display:block;width:100%;height:100%;line-height:38px;text-decoration:none;color:inherit;font-weight:700;overflow:hidden;white-space:nowrap}
.cal td.occ.st-confirmed{background:var(--gold-soft)}.cal td.occ.st-checked-in{background:#cfe5d6}.cal td.occ.st-checked-out{background:#dde3ea}.cal td.occ.st-enquiry{background:#ecebe7}.cal td.clash{background:#f2c2b8}.cal td.occ.ext{background:#d9d2ee;color:#4a3d7a}
.legend{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lg{display:inline-block;width:12px;height:12px;border-radius:3px;margin-left:4px}
.lg.st-confirmed{background:var(--gold-soft)}.lg.st-checked-in{background:#cfe5d6}.lg.st-checked-out{background:#dde3ea}.lg.st-enquiry{background:#ecebe7}.lg.clash{background:#f2c2b8}.lg.ext{background:#d9d2ee}
.roomrow{display:flex;justify-content:space-between;align-items:center;gap:10px}.roomrow small{color:var(--muted)}
.roomedit{display:grid;grid-template-columns:1.4fr 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
.season{border:1px dashed var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.season .two{margin-bottom:8px}
.inline2{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center;margin:0 0 6px}.inline2>span{margin:0}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;color:var(--muted);font-weight:600;font-size:12.5px;border-bottom:1px solid var(--line);padding:6px 4px}
.tbl td{padding:7px 4px;border-bottom:1px dashed var(--line2)}.tbl .r,.tbl td:not(:first-child){text-align:right}
.tbl tr.strong td{font-weight:700;border-top:1px solid var(--ink)}
.lock{text-align:center;margin-top:40px}.lock input{text-align:center;font-size:24px;letter-spacing:8px;margin:10px 0}
.bill{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.docwrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;overflow-x:auto;-webkit-print-color-adjust:exact;print-color-adjust:exact}.docwrap .ahdoc{min-width:560px}.docwrap .ahdoc.stmt{min-width:0}.docwrap .stmt .lh .nm{font-size:16pt}.docwrap .stmt td,.docwrap .stmt th{padding:4px 5px}
.logorow{display:flex;gap:12px;align-items:center;margin-bottom:10px}.logorow img{width:64px;height:64px;border-radius:10px;border:1px solid var(--line);object-fit:contain;background:var(--card)}
label.chip{display:inline-flex;align-items:center;cursor:pointer}details.fld summary{font-weight:600;color:var(--green);cursor:pointer;padding:6px 0}
.btn.on{background:var(--green);color:#fff}
.bill-h{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid var(--gold);padding-bottom:10px;margin-bottom:10px}
.bill-brand{font:700 22px var(--serif);color:var(--green)}.bill-h .r{text-align:right}.bill-g{font-size:14px;margin-bottom:10px}
.printhead{display:none}
#tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
#tabs a{flex:1;min-width:0;text-align:center;text-decoration:none;color:var(--muted);font-size:10.5px;font-weight:600;padding:8px 0 7px;min-height:56px}
#tabs a i{display:block;font-style:normal;font-size:20px;line-height:24px}
#tabs a.on{color:var(--green)}#tabs a.on i{color:var(--gold)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--green);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;z-index:9}
#toast.show{opacity:1;transform:translateX(-50%)}#toast.bad{background:var(--red)}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.anhead{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:var(--r);padding:12px 14px;margin:0 0 10px;font-size:15px}
.chg{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 6px;border-radius:6px;background:#eceae4;color:#555}
.chg.good{background:var(--ok-soft);color:var(--ok)}.chg.bad{background:var(--red-soft);color:var(--red)}
.chart h3{margin-bottom:12px}
.brow{display:grid;grid-template-columns:minmax(0,34%) minmax(0,1fr);gap:8px;align-items:center;margin:0 0 10px;font-size:13px}
.blab{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.bbars{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 6px;align-items:center}
.bar{height:12px;border-radius:0 4px 4px 0;min-width:2px}.bar.a{background:var(--green)}.bar.b{background:var(--gold)}
.bval{font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}.bval.muted{color:var(--muted)}
.legend2{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
.sw{display:inline-block;width:12px;height:10px;border-radius:2px}.sw.a{background:var(--green)}.sw.b{background:var(--gold)}
.lsvg{width:100%;height:auto;display:block}.lsvg .la{fill:none;stroke:var(--green);stroke-width:2.2}.lsvg .lb{fill:none;stroke:var(--gold);stroke-width:2;stroke-dasharray:4 3}

.roomline{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 40px;gap:8px;align-items:center;margin-bottom:8px}

.payline{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 40px;gap:8px;align-items:center;margin-bottom:10px;padding-bottom:8px;border-bottom:1px dashed var(--line)}.payline [data-pk=date],.payline [data-pk=ref]{grid-column:span 1}.payline [data-pk=ref]{grid-column:2/3}

.linkbtn{background:none;border:0;padding:0;color:var(--green);font-weight:700;text-decoration:underline;font-size:12px;cursor:pointer}

.thumb{grid-area:t;width:64px;height:64px;border-radius:8px;background:#eceae4;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:12px;font-weight:700;color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover}.dmeta{grid-area:m}.dmeta small{display:block;color:var(--muted)}.dact{grid-area:a;display:flex;gap:6px;flex-wrap:wrap}

.fcrow b{word-break:break-word}.muted{color:var(--muted);font-weight:400}
@media (max-width:360px){.tiles{grid-template-columns:1fr}.three{grid-template-columns:1fr 1fr}}
@media print{
  header,#tabs,#toast,.noprint,.cta,.alert{display:none!important}
  body{background:var(--card);padding:0}main{max-width:none;padding:0}
  .card,.tile,.bill,.chart,.anhead{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  .docwrap{border:0;padding:0}.docwrap .ahdoc{min-width:0}
  .bar.a{background:#1e3a2b!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.bar.b,.sw.b{background:#b8955a!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.sw.a{background:#1e3a2b!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tiles{grid-template-columns:repeat(4,1fr)}

  .tile .tv{font-size:16px}
}

/* ================= Version 2.0 design layer ================= */
@font-face{font-family:"Playfair Display";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/playfair-display-latin-600-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2122,U+2212}
@font-face{font-family:"Inter";font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/inter-latin-wght-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2122,U+2212}
:root{
  --green:#1d3a2b; --green2:#2b5641; --green-ink:#17301f; --gold:#b48e52; --gold2:#c9a66b; --gold-soft:#f1e6d0; --bg:#f5f2ea; --card:#fffefb; --field:#fbf9f4; --soft:#f6f3ec;
  --ink:#1c231e; --muted:#6a726b; --line:#e7e1d4; --line2:#efeadf; --line3:#d8d1c1; --red:#b1402f; --red-soft:#f8e4df; --red-tint:#fff8f6; --amber:#93650f; --amber-soft:#faefd6;
  --ok:#2c6a44; --ok-soft:#e2efe5; --blue:#3f5872; --blue-soft:#e5eaf0; --purple:#5b4b8a; --purple-soft:#e9e4f6;
  --r:16px; --r-sm:11px; --shadow:0 1px 2px rgba(23,48,31,.05),0 4px 14px -6px rgba(23,48,31,.10); --shadow-lg:0 10px 30px -10px rgba(23,48,31,.28);
  --serif:"Playfair Display","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --tabh:62px; --side:252px; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --green:#1a3326; --green2:#8fc2a4; --green-ink:#e9efe9; --gold:#c9a66b; --gold2:#d9bb85; --gold-soft:#3a3122; --bg:#101512; --card:#171e1a; --field:#1c2420; --soft:#1b231f;
    --ink:#e8ebe6; --muted:#9aa49c; --line:#28322c; --line2:#222b26; --line3:#36413a; --red:#f08a78; --red-soft:#3b2220; --red-tint:#221917; --amber:#e8b860; --amber-soft:#352b17;
    --ok:#7fcf9c; --ok-soft:#1b3326; --blue:#9fb7d1; --blue-soft:#1f2a35; --purple:#bcaef0; --purple-soft:#2a2540;
    --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 10px 30px -10px rgba(0,0,0,.7); color-scheme:dark;
  }
  h2,h3,.bk-top .name,.monthbar b{color:var(--ink)!important}
  .tile .tv{color:var(--ink)}
  a{color:var(--green2)}
  .btn{color:var(--ink)}
  .st-enquiry,.chg{background:#262d29!important;color:#c6ccc7!important}
  .st-confirmed{background:var(--gold-soft)!important;color:var(--gold2)!important}
  .st-checked-out,.fl-overpaid{background:var(--blue-soft)!important;color:var(--blue)!important}
  .alert.grey{background:#232a26;color:#c6ccc7}
  .cal td.occ.st-checked-in,.lg.st-checked-in{background:#24402f}
  .docwrap,.bill,.docwrap *{color-scheme:light}
  .docwrap,.bill{background:#fff!important;color:#1d241f}
  .thumb{background:#242c27}
  input,select,textarea{color:var(--ink)}
}
html,body{font:15.5px/1.5 var(--sans);letter-spacing:-.005em;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
.ic.end{margin-left:auto;opacity:.45;width:18px;height:18px}
button .ic,.btn .ic{margin-right:7px;width:18px;height:18px}
.btn.icon-only .ic{margin:0}
h3 .ic{color:var(--gold);width:19px;height:19px}

/* header */
header{background:var(--green);border-bottom:0;box-shadow:0 1px 0 rgba(255,255,255,.04),0 6px 18px -12px rgba(0,0,0,.5);padding:calc(env(safe-area-inset-top) + 9px) 12px 10px;min-height:56px;gap:10px}
header::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:linear-gradient(90deg,transparent,var(--gold) 20%,var(--gold2) 50%,var(--gold) 80%,transparent)}
header h1{font:600 18.5px/1.2 var(--serif);letter-spacing:.2px}
#back{display:flex;align-items:center;justify-content:center;border-radius:10px;padding:0;color:var(--gold-soft)}
#back .ic{width:24px;height:24px}
#logo{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,var(--gold2),var(--gold));color:#1d3a2b;font:600 17px var(--serif);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);overflow:hidden}
#logo img{width:100%;height:100%;object-fit:cover;background:#fff}
.syncdot{width:34px;height:34px;border:0;border-radius:10px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;flex:none}
.syncdot::before{content:"";width:9px;height:9px;border-radius:50%;background:#9aa49c;box-shadow:0 0 0 3px rgba(154,164,156,.18)}
.syncdot.ok::before{background:#6fd394;box-shadow:0 0 0 3px rgba(111,211,148,.22)}
.syncdot.err::before{background:#f08a78;box-shadow:0 0 0 3px rgba(240,138,120,.25)}
.syncdot.busy::before{background:var(--gold2);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}
#net{background:rgba(255,255,255,.12);color:var(--gold-soft);font-weight:600}

main{max-width:680px;padding:14px 16px 28px}
main.enter{animation:enter .22s cubic-bezier(.2,.7,.3,1)}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){main.enter{animation:none}.syncdot.busy::before{animation:none}}
h2{font:600 17px/1.3 var(--serif);margin:26px 2px 10px;color:var(--green-ink)}
h2 .more{font:600 13.5px var(--sans);color:var(--gold)}
h3{font:600 15.5px/1.3 var(--serif);color:var(--green-ink);margin-bottom:12px}

/* surfaces */
.card,.tile,.empty,.calwrap,details.day,.fsl{box-shadow:var(--shadow)}
.card{border-radius:var(--r);padding:16px;margin-bottom:12px;border-color:var(--line)}
a.card{transition:transform .12s,box-shadow .12s}
a.card:active{transform:scale(.995)}
@media (hover:hover){a.card:hover,.tile.tlink:hover{box-shadow:var(--shadow-lg)}}
.tiles{gap:12px}
.tile{border-radius:var(--r);padding:14px 15px;display:block;text-decoration:none;color:inherit}
.tile .tl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tile .tv{font:650 23px/1.2 var(--sans);letter-spacing:-.02em;margin-top:6px}
.tile .ts{font-size:12.5px;margin-top:4px}
.tile.warnv{border-color:#ead9b5}
.empty{border-style:solid;border-radius:var(--r);padding:22px 12px;color:var(--muted)}
.empty .leaf{font-size:20px;opacity:.8}

/* buttons */
.btn{border-radius:12px;min-height:44px;font:600 14.5px var(--sans);border-color:var(--line3);background:var(--card);transition:background .12s,transform .08s,box-shadow .12s;gap:0}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(180deg,#24493a,var(--green));border-color:var(--green);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 4px 12px -6px rgba(29,58,43,.6)}
.btn.primary .ic{color:var(--gold2)}
.btn.big{min-height:54px;border-radius:14px;font-size:16.5px}
.btn.sm{min-height:36px;border-radius:10px;font-size:13.5px}
.btn.icon-only{width:38px;padding:0}
.btn.wa{color:#1b7a3e;border-color:#bfe2c8}
.cta{border-radius:14px;border-bottom:0;box-shadow:0 6px 16px -8px rgba(29,58,43,.6)}

/* inputs */
input,select,textarea{border-radius:11px;background:var(--field);border-color:var(--line3);transition:border-color .12s,box-shadow .12s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px rgba(180,142,82,.22)}
.fld>span{font-size:12.5px;letter-spacing:.01em}
.secret{display:flex;gap:6px;align-items:stretch}.secret input{flex:1;min-width:0}.secret .btn{flex:none;min-height:46px}

/* status chips with a dot */
.st{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;padding:4px 10px 4px 8px;letter-spacing:.01em}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.flag{border-radius:7px;font-weight:650}
.bk-top b{font-size:16px;font-weight:650;letter-spacing:-.01em}
.bk-bot{font-size:13px}

/* alerts */
.alerts{display:grid;gap:8px;margin:4px 0 14px}
.alert{display:flex;align-items:center;gap:10px;margin:0;border-radius:12px;padding:11px 12px;font-weight:600;font-size:13.5px;line-height:1.35;border:1px solid transparent}
.alert.red{border-color:rgba(177,64,47,.15)}.alert.amber{border-color:rgba(147,101,15,.15)}

/* home */
.alerts .alert.extra{display:none}.alerts.all .alert.extra{display:flex}
.alerts-more{padding:2px 4px;margin:0;justify-self:start;text-decoration:none}
@media (max-width:699px){.todaygrid{grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:82%;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}.todaygrid::-webkit-scrollbar{display:none}.tcard{scroll-snap-align:start}}
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:4px 2px 14px;flex-wrap:wrap}
.hello small{color:var(--muted);font-size:13px;font-weight:500}
.hello-h{margin:2px 0 0!important;font-size:25px!important;letter-spacing:-.01em}
.hello-act{display:flex;gap:8px}
.todaygrid{display:grid;gap:10px;grid-template-columns:1fr}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.tc-h{display:flex;align-items:center;gap:8px;font-weight:650;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.tc-h .ic{color:var(--gold)}
.tc-h b{margin-left:auto;font:650 22px var(--sans);color:var(--green-ink);letter-spacing:-.02em;text-transform:none}
.tcard a{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--line2);text-decoration:none;color:var(--ink);font-size:14px}
.tcard a span{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tcard a small{color:var(--muted);white-space:nowrap}
.tcard a.tc-more{color:var(--gold);font-weight:600}
.tc-empty{margin:4px 0 2px;color:var(--muted);font-size:13.5px}
.tiles.t4,.tiles.t3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.duo{display:grid;gap:12px;grid-template-columns:1fr;margin-top:14px}
.linkcard{margin:0}
.lc-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}.lc-h .ic{color:var(--gold)}.lc-h b{font:600 15.5px var(--serif);color:var(--green-ink)}
.hkmini{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.hkmini span{background:var(--soft);border-radius:8px;padding:4px 9px;display:inline-flex;align-items:center;gap:5px}
.hkmini b{color:var(--ink)}
.hkmini .dirty{background:var(--red-soft);color:var(--red)}.hkmini .cleaning{background:var(--amber-soft);color:var(--amber)}.hkmini .ready{background:var(--ok-soft);color:var(--ok)}
.hkmini .dirty b,.hkmini .cleaning b,.hkmini .ready b{color:inherit}
.hkmini .ic{width:15px;height:15px;margin:0}

/* segmented control */
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px;margin:0 0 14px;gap:3px}
.seg a{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;min-height:38px;border-radius:9px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px}
.seg a.on{background:var(--card);color:var(--green-ink);box-shadow:var(--shadow)}
.seg a.on .ic{color:var(--gold)}
.monthbar{gap:8px;margin:2px 0 12px}.monthbar b{font:600 18px var(--serif)}
.mb-r{display:flex;gap:6px}

/* calendar v2 */
.calwrap{position:relative;border-radius:var(--r)}
.cal{font-size:11.5px;border-collapse:separate;border-spacing:0}
.cal th,.cal td{border:0;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);min-width:38px;height:44px}
.cal th{height:40px;line-height:1.1;font-weight:600;background:var(--soft);font-size:12px;color:var(--ink)}
.cal th small{display:block;font-size:9.5px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.cal th.wkend{background:color-mix(in srgb,var(--soft) 70%,var(--gold-soft))}
.cal th.tday{background:var(--gold);color:#fff}.cal th.tday small{color:rgba(255,255,255,.85)}
.cal .rn{background:var(--card);min-width:96px;max-width:120px;font-size:12.5px;box-shadow:1px 0 0 var(--line)}
.cal th.rn{background:var(--soft)}
.cal td.free{cursor:pointer;transition:background .1s}
@media (hover:hover){.cal td.free:hover{background:var(--gold-soft)}}
.cal td.free.past{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--line2) 6px 7px)}
.cal td.sel{background:color-mix(in srgb,var(--gold) 35%,transparent)!important;box-shadow:inset 0 0 0 1.5px var(--gold)}
.cal td.bk{padding:5px 2px}
.cbar{display:flex;align-items:center;gap:4px;height:32px;line-height:32px;padding:0 9px;border-radius:9px;text-decoration:none;font-weight:650;font-size:12px;overflow:hidden;white-space:nowrap;border:1px solid transparent}
.cbar span{overflow:hidden;text-overflow:ellipsis}
.cbar .ic{width:14px;height:14px;margin:0;flex:none}
.cbar.cont{border-top-left-radius:2px;border-bottom-left-radius:2px;margin-left:-3px}
.cbar.more{border-top-right-radius:2px;border-bottom-right-radius:2px;margin-right:-3px}
.cbar.via{opacity:.82;border-style:dashed}
.cbar.st-confirmed{background:var(--gold-soft);color:#6f5220;border-color:#e4d1aa}
.cbar.st-checked-in{background:#d3e8da;color:#1f5634;border-color:#b7d8c2}
.cbar.st-checked-out{background:var(--blue-soft);color:var(--blue);border-color:#d0d9e3}
.cbar.st-enquiry{background:#eceae4;color:#5d5a52;border-color:#dedad0}
.cbar.ext{background:var(--purple-soft);color:var(--purple);border-color:#d8d0ee}
.cbar.clash{background:#f4c9bf;color:#8a2a1b;border-color:#e9a495}
@media (prefers-color-scheme:dark){.cbar.st-confirmed{color:var(--gold2);border-color:#4a3e28}.cbar.st-checked-in{background:#1f3a2a;color:#9ad7b0;border-color:#2c4c39}.cbar.st-enquiry{background:#262d29;color:#c6ccc7;border-color:#333b36}.cbar.ext{border-color:#3a3358}.cbar.clash{background:#4a2420;color:#ffb3a5;border-color:#6a322b}.cbar.st-checked-out{border-color:#2b3745}}
.todayline{position:absolute;top:0;width:2px;margin-left:-1px;background:var(--gold);opacity:.55;pointer-events:none;z-index:2}
.lg{border-radius:4px;vertical-align:-1px}.lg.ext{background:var(--purple-soft)}
.pickbar{position:fixed;left:12px;right:12px;bottom:calc(var(--tabh) + 12px + env(safe-area-inset-bottom));z-index:7;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 10px 10px 14px;box-shadow:var(--shadow-lg);max-width:560px;margin:0 auto}
.pickbar>div{flex:1;min-width:0}.pickbar b{display:block}.pickbar small{color:var(--muted)}

/* housekeeping */
.hkstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.hks{border-radius:var(--r);padding:12px;text-align:center;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
.hks b{display:block;font:650 26px var(--sans);letter-spacing:-.02em}.hks span{font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.hks.dirty b{color:var(--red)}.hks.cleaning b{color:var(--amber)}.hks.ready b{color:var(--ok)}
.hkgrid{display:grid;gap:12px}
.card.hk{margin:0;border-left:4px solid var(--line3)}
.card.hk.hk-dirty{border-left-color:var(--red)}.card.hk.hk-cleaning{border-left-color:var(--amber)}.card.hk.hk-ready{border-left-color:var(--ok)}
.card.hk.urgent{background:var(--red-tint);border-color:rgba(177,64,47,.35)}
.hk-top{display:flex;justify-content:space-between;align-items:center;gap:8px}.hk-top b{font:600 16px var(--serif);color:var(--green-ink)}
.hkchip{font-size:11.5px;font-weight:700;border-radius:20px;padding:3px 10px;text-transform:uppercase;letter-spacing:.04em}
.hkchip.dirty{background:var(--red-soft);color:var(--red)}.hkchip.cleaning{background:var(--amber-soft);color:var(--amber)}.hkchip.ready{background:var(--ok-soft);color:var(--ok)}
.hk-who{color:var(--muted);font-size:13.5px;margin:6px 0 2px}.hk-who .arr{color:var(--ink)}
.hk-warn{display:flex;align-items:center;gap:6px;color:var(--red);font-weight:650;font-size:13px;margin-top:6px}.hk-warn .ic{width:16px;height:16px}
.hk-at{font-size:11.5px;color:var(--muted);margin-top:4px}
.hkbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.hkbtns button{min-height:42px;border-radius:10px;border:1px solid var(--line3);background:var(--field);color:var(--muted);font:600 13.5px var(--sans);cursor:pointer}
.hkbtns button.on.dirty{background:var(--red);border-color:var(--red);color:#fff}
.hkbtns button.on.cleaning{background:var(--amber);border-color:var(--amber);color:#fff}
.hkbtns button.on.ready{background:var(--ok);border-color:var(--ok);color:#fff}
@media (prefers-color-scheme:dark){.hkbtns button.on{color:#111!important}}

/* repeat guests */
.card.repeat{border-left:4px solid var(--green2);padding:14px 16px}
.card.repeat.premium{border-left-color:var(--gold);background:linear-gradient(135deg,color-mix(in srgb,var(--gold-soft) 55%,var(--card)),var(--card) 60%)}
.rp-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}.rp-h .ic{color:var(--gold)}.rp-h b{font:600 15.5px var(--serif);color:var(--green-ink)}.rp-h .pill{margin-left:auto}
.rp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}.rp-grid small{display:block;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}.rp-grid b{font:650 16px var(--sans);font-variant-numeric:tabular-nums}
.tag-prem,.tag-rep{display:inline-flex;align-items:center;gap:3px;font:700 10.5px var(--sans);text-transform:uppercase;letter-spacing:.05em;border-radius:20px;padding:2px 8px;vertical-align:2px;margin-left:4px}
.tag-prem{background:linear-gradient(145deg,var(--gold2),var(--gold));color:#1d3a2b}.tag-prem .ic{width:11px;height:11px;margin:0;stroke-width:2.4}
.tag-rep{background:var(--ok-soft);color:var(--ok)}.tag-rep .ic{width:11px;height:11px;margin:0;stroke-width:2.4}
/* guest QR */
.qrlist{padding:6px 16px}
.qrbox{display:flex;gap:16px;align-items:center;padding:14px 0;border-top:1px solid var(--line2)}.qrbox:first-child{border-top:0}
.qrimg{flex:none;width:132px;height:132px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff}.qrimg svg{width:100%;height:100%;display:block}
.qrmeta{min-width:0}.qrmeta b{display:block;font:600 16px var(--serif);color:var(--green-ink)}.qrmeta small{display:block;color:var(--muted);font-size:13px;margin-top:2px}.qrmeta .actions{margin:10px 0 0}
.warn-s{color:var(--amber)!important;font-weight:600}
.pcards{display:flex;flex-wrap:wrap;gap:18px;justify-content:center}
.pcard{width:9cm;background:#fffdf8;color:#1c231e;border-radius:18px;padding:22px 20px 20px;text-align:center;border:1px solid #e3dccb;box-shadow:var(--shadow);position:relative;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pcard::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,#1d3a2b,#2b5641 40%,#b48e52)}
.pc-mono{width:44px;height:44px;border-radius:50%;margin:4px auto 8px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#c9a66b,#b48e52);color:#1d3a2b;font:600 22px var(--serif)}
.pc-name{font:600 12px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:#6a726b}
.pc-title{font:600 28px/1.2 var(--serif);color:#1d3a2b;margin:4px 0 12px}
.pc-qr{width:6.2cm;height:6.2cm;margin:0 auto;border-radius:12px;overflow:hidden;border:1px solid #e3dccb}.pc-qr svg{width:100%;height:100%;display:block}
.pc-line{font-size:13.5px;color:#3c443e;margin-top:12px;line-height:1.4}
.pc-wifi{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;text-align:left;margin:12px auto 0;background:#f4ecdc;border-radius:10px;padding:10px 12px;font-size:13px;max-width:7cm}.pc-wifi span{color:#6a726b}.pc-wifi b{font-family:ui-monospace,Menlo,monospace;word-break:break-all}
@media print{.pcards{gap:12px}.pcard{box-shadow:none;break-inside:avoid;page-break-inside:avoid}main{padding:0!important}}
/* cash close */
.ccres{margin-top:4px;background:var(--soft);border-radius:var(--r-sm);padding:4px 12px}
.ccres:empty{display:none}
.okc{color:var(--ok);font-weight:700}
.ok .ic,.btn.big .ic{vertical-align:-4px}

/* lists (More, Reports) */
.card.list{padding:4px 0}
.li{display:flex;align-items:center;gap:12px;padding:13px 16px;text-decoration:none;color:var(--ink);border-top:1px solid var(--line2);font-weight:550}
.li:first-child{border-top:0}
.li>.ic:first-child{color:var(--gold);width:21px;height:21px}
.li span{flex:1;min-width:0}.li.two-line b{display:block;font-weight:650}.li.two-line small{display:block;color:var(--muted);font-size:12.5px;font-weight:400;margin-top:1px}
@media (hover:hover){.li:hover{background:var(--soft)}}

/* booking form */
.formnav{position:sticky;top:calc(58px + env(safe-area-inset-top));z-index:4;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 2px;margin:-6px -2px 6px;background:var(--bg)}
.formnav::-webkit-scrollbar{display:none}
.formnav button{flex:none;border:1px solid var(--line3);background:var(--card);color:var(--muted);border-radius:20px;padding:7px 14px;font:600 13px var(--sans);cursor:pointer}
.formnav button:active{background:var(--gold-soft);color:var(--ink)}
.sumbar{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom));z-index:6;display:flex;align-items:center;gap:12px;padding:10px 16px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.sumbar>div{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.sumbar b{font:700 19px var(--sans);letter-spacing:-.02em;color:var(--green-ink)}
.sumbar small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sumbar .btn{min-width:110px}
body:has(.sumbar) main{padding-bottom:96px}
body:has(.sumbar) #toast{bottom:calc(var(--tabh) + 84px + env(safe-area-inset-bottom))}
@media (min-width:1024px){body:has(.sumbar) #toast{bottom:96px}}

/* PIN sheet */
.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(10,18,13,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px;animation:fade .15s}
.sheet{width:100%;max-width:420px;background:var(--card);border-radius:20px;padding:20px;box-shadow:var(--shadow-lg);animation:up .2s cubic-bezier(.2,.7,.3,1)}
.sheet input{text-align:center;font-size:22px;letter-spacing:8px;margin:6px 0 12px}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(20px);opacity:0}}
@media (min-width:700px){.sheet-bg{align-items:center}}

/* skeleton */
.skel{display:grid;gap:12px}.skel i{display:block;height:84px;border-radius:var(--r);background:linear-gradient(90deg,var(--line2),var(--soft),var(--line2));background-size:200% 100%;animation:sh 1.2s linear infinite}
.skel i.s{height:54px}@keyframes sh{to{background-position:-200% 0}}

/* bottom tabs */
#tabs{height:auto;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);box-shadow:0 -6px 20px -16px rgba(0,0,0,.35)}
#tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:var(--tabh);font-size:10.5px;font-weight:600;letter-spacing:.01em;position:relative}
#tabs a .ic{width:22px;height:22px;stroke-width:1.6}
#tabs a.on{color:var(--green-ink)}#tabs a.on .ic{color:var(--gold);stroke-width:2}
#tabs a.on::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
#tabs .side-only,#tabs .brand,#tabs .sidefoot{display:none}
#tabs a.brand{flex:none;flex-direction:row;text-align:left;justify-content:flex-start}
#toast{border-radius:12px;box-shadow:var(--shadow-lg);bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom))}
body{padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom))}

/* tablet */
@media (min-width:700px){
  main{max-width:860px;padding:20px 24px 32px}
  .tiles.t4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .tiles.t3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .todaygrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .duo{grid-template-columns:1fr 1fr}
  .hkgrid{grid-template-columns:1fr 1fr}
}
/* laptop: left sidebar */
@media (min-width:1024px){
  body{padding-bottom:0;padding-left:var(--side)}
  header{padding-left:28px;padding-right:24px}
  #logo{display:none!important}
  main{max-width:1120px;padding:26px 36px 48px}
  form#bf,form#gf,form#ccf,#lf{max-width:780px}
  #tabs{top:0;right:auto;width:var(--side);flex-direction:column;padding:0 12px 16px;border-top:0;border-right:1px solid rgba(255,255,255,.06);background:var(--green);backdrop-filter:none;box-shadow:none;overflow-y:auto}
  #tabs .brand{display:flex;align-items:center;gap:12px;padding:18px 8px 20px;margin-bottom:10px;border-bottom:1px solid rgba(255,255,255,.08);text-decoration:none}
  #tabs .brand i{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,var(--gold2),var(--gold));color:#1d3a2b;font:600 20px var(--serif);font-style:normal}
  #tabs .brand span{color:#fff;font:600 17px/1.2 var(--serif)}#tabs .brand small{display:block;font:500 11.5px var(--sans);color:rgba(255,255,255,.55);letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
  #tabs a:not(.brand){flex:none;flex-direction:row;justify-content:flex-start;gap:12px;min-height:44px;padding:0 12px;border-radius:10px;font-size:14.5px;font-weight:550;color:rgba(255,255,255,.72);margin:1px 0}
  #tabs a:not(.brand) .ic{width:20px;height:20px}
  #tabs a.on{background:rgba(255,255,255,.09);color:#fff}#tabs a.on::before{left:0;top:10px;bottom:10px;width:3px;height:auto;border-radius:0 3px 3px 0}
  @media (hover:hover){#tabs a:not(.brand):not(.on):hover{background:rgba(255,255,255,.05);color:#fff}}
  #tabs .side-only{display:flex}
  #tabs .sidesep{display:block;height:1px;background:rgba(255,255,255,.08);margin:10px 8px}
  #tabs .sidefoot{display:flex;margin-top:auto;align-items:center;gap:10px;padding:12px 10px 0;color:rgba(255,255,255,.55);font-size:12px;border-top:1px solid rgba(255,255,255,.08)}
  #tabs .sidefoot .syncdot{width:22px;height:22px;background:none}
  #header-sync{display:none}
  #toast{bottom:28px;left:calc(50% + var(--side) / 2)}
  .sumbar{left:var(--side);bottom:0;padding:12px 36px}
  .pickbar{left:calc(var(--side) + 24px);bottom:24px}
  .formnav{top:58px}
  .hkgrid{grid-template-columns:repeat(3,1fr)}
  .tcard{padding:14px 16px}
  .cal th,.cal td{min-width:44px}
}
#tabs .sidesep{display:none}
@media (min-width:1024px){#tabs .sidesep{display:block}}
@media print{.sumbar,.formnav,.pickbar,.seg,.syncdot,#logo{display:none!important}body{padding-left:0!important}}
</style>
