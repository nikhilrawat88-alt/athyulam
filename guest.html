<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Welcome</title>
<meta name="theme-color" content="#1d3a2b">
<link rel="icon" href="icons/icon-192.png">
<!-- Guest page (version 2.0.3). Everything shown here is packed inside the QR code link itself:
     no guest data, nothing is fetched, nothing is stored. -->
<style>
@font-face{font-family:"Playfair Display";font-weight:600;font-display:swap;src:url(fonts/playfair-display-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:100 900;font-display:swap;src:url(fonts/inter-latin-wght-normal.woff2) format("woff2")}
:root{--green:#1d3a2b;--green2:#2b5641;--gold:#b48e52;--gold2:#c9a66b;--gold-soft:#f1e6d0;--bg:#f5f2ea;--card:#fffefb;--ink:#1c231e;--muted:#6a726b;--line:#e7e1d4;
  --serif:"Playfair Display",Georgia,serif;--sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;--shadow:0 1px 2px rgba(23,48,31,.05),0 6px 18px -8px rgba(23,48,31,.14)}
@media (prefers-color-scheme:dark){:root{--bg:#101512;--card:#171e1a;--ink:#e8ebe6;--muted:#9aa49c;--line:#28322c;--gold-soft:#3a3122;--shadow:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
.hero{background:radial-gradient(120% 90% at 50% 0%,#2a5641 0%,var(--green) 60%);color:#fff;text-align:center;padding:calc(env(safe-area-inset-top) + 34px) 22px 46px;position:relative}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold) 20%,var(--gold2) 50%,var(--gold) 80%,transparent)}
.mono{width:62px;height:62px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,var(--gold2),var(--gold));color:var(--green);font:600 30px var(--serif);box-shadow:0 0 0 4px rgba(255,255,255,.08)}
.hero small{display:block;letter-spacing:.22em;text-transform:uppercase;font-size:11.5px;color:rgba(255,255,255,.65);font-weight:600}
.hero h1{margin:6px 0 8px;font:600 30px/1.15 var(--serif)}
.hero p{margin:0 auto;max-width:440px;color:rgba(255,255,255,.82);font-size:15px}
main{max-width:560px;margin:-22px auto 0;padding:0 16px calc(40px + env(safe-area-inset-bottom));position:relative}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
h2{font:600 18px var(--serif);margin:0 0 12px;display:flex;align-items:center;gap:10px;color:var(--ink)}
h2 svg{color:var(--gold)}
svg.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}.kv span{color:var(--muted)}.kv b{text-align:right;word-break:break-all}
.wifi-pass{font:650 22px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em;background:var(--gold-soft);border-radius:12px;padding:12px 14px;margin:6px 0 10px;word-break:break-all;color:var(--ink)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 15px var(--sans);text-decoration:none;cursor:pointer}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.primary svg{color:var(--gold2)}
.btn.wa{background:#1f8a4c;border-color:#1f8a4c;color:#fff}
.btn.full{grid-column:1/-1}
.times{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.time{background:var(--bg);border-radius:14px;padding:12px;text-align:center}.time small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}.time b{font:650 20px var(--sans)}
ol.rules{margin:0;padding:0;list-style:none;counter-reset:r}
ol.rules li{counter-increment:r;display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line)}ol.rules li:first-child{border-top:0}
ol.rules li::before{content:counter(r);flex:none;width:24px;height:24px;border-radius:50%;background:var(--gold-soft);color:var(--gold);font:700 12px var(--sans);display:flex;align-items:center;justify-content:center;margin-top:1px}
.note{white-space:pre-line;color:var(--ink)}
.cat{margin:16px 0 4px;font:600 12px var(--sans);text-transform:uppercase;letter-spacing:.1em;color:var(--gold)}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item .nm{flex:1;min-width:0}.item .pr{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 18px var(--sans);line-height:1;cursor:pointer}
.qty b{min-width:16px;text-align:center}
.order{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));background:var(--green);color:#fff;border-radius:16px;padding:12px 12px 12px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.order>div{flex:1}.order small{display:block;opacity:.75}.order input{width:86px;border-radius:10px;border:0;padding:9px;font:600 14px var(--sans)}
.hide{display:none!important}
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:22px}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}#toast.show{opacity:1}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="wifi" viewBox="0 0 24 24"><path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.3a9.5 9.5 0 0 1 13 0M8.6 15.6a5 5 0 0 1 6.8 0"/><circle cx="12" cy="19" r="1"/></symbol>
<symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.5V12l3 2"/></symbol>
<symbol id="phone" viewBox="0 0 24 24"><path d="M5 4h3.5l1.7 4.3-2.1 1.4a10.6 10.6 0 0 0 6.2 6.2l1.4-2.1L20 15.5V19a1.5 1.5 0 0 1-1.6 1.5A16.5 16.5 0 0 1 3.5 5.6 1.5 1.5 0 0 1 5 4z"/></symbol>
<symbol id="list" viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></symbol>
<symbol id="pin" viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0C18.5 15.4 12 21 12 21z"/><circle cx="12" cy="10" r="2.3"/></symbol>
<symbol id="star" viewBox="0 0 24 24"><path d="m12 3.6 2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></symbol>
<symbol id="food" viewBox="0 0 24 24"><path d="M6.5 3v7.5a2 2 0 0 0 2 2V21M10.5 3v7.5a2 2 0 0 1-2 2M8.5 3v5"/><path d="M17.5 21V3c-2.2 1-3.5 3.6-3.5 7v3.5h3.5"/></symbol>
<symbol id="copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8"/></symbol>
<symbol id="info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M12 11v5.5M12 7.8v.01"/></symbol>
<symbol id="wa" viewBox="0 0 24 24"><path d="M4 20l1.2-4A8 8 0 1 1 8 18.8z"/><path d="M9 9.5c.3 1.8 2 3.6 3.9 4.2l1.3-1.1 1.8.9-.3 1.2c-3.2.5-7.1-3.3-6.6-6.5l1.2-.3.9 1.8z"/></symbol>
</svg>
<div id="app"><div class="empty">Loading…</div></div>
<div id="toast" role="status"></div>
<script src="lib/fflate.js"></script>
<script>
(function () {
  'use strict';
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function ic(n) { return '<svg class="ic"><use href="#' + n + '"/></svg>'; }
  function inr(n) { return '₹' + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 }); }
  function toast(m) { var t = document.getElementById('toast'); t.textContent = m; t.className = 'show'; clearTimeout(toast.t); toast.t = setTimeout(function () { t.className = ''; }, 2000); }
  /* only web links: a hand-made link must not be able to run code on this site (the owner's app lives here too) */
  function safeUrl(u) { u = String(u || '').trim(); return /^https:\/\/[^\s"'<>]+$/i.test(u) ? u : ''; }
  function digits(p) { var d = String(p || '').replace(/\D/g, ''); return d.length === 10 ? '91' + d : (d.length >= 11 && d.length <= 15 ? d : ''); }
  function decode() {
    var h = location.hash.replace(/^#/, ''), m = /(?:^|&)z=([A-Za-z0-9_-]+)/.exec(h);
    if (!m) return null;
    var b64 = m[1].replace(/-/g, '+').replace(/_/g, '/'); while (b64.length % 4) b64 += '=';
    var bin = atob(b64), u8 = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    return JSON.parse(fflate.strFromU8(fflate.inflateSync(u8)));
  }
  function copy(text, msg) {
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function () { toast(msg); }).catch(function () {
      var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast(msg); } catch (e) { /* nothing */ } ta.remove();
    });
  }
  window.addEventListener('hashchange', function () { location.reload(); });
  /* Version 2.0.4: details packed in the QR show at once; if the QR also names a card and your Google Sheet link,
     the latest details are fetched from the Sheet and replace them (no reprint needed). The last good copy is kept
     on the guest's phone for the next visit. */
  var packed; try { packed = decode(); } catch (e) { packed = null; }
  var state = { failed: false };
  var LIVE = /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/;
  var cacheKey = packed && packed.id ? 'ahGuest:' + packed.id + ':' + (packed.t === 'menu' ? 'menu' : 'info') : '';
  function fromCache() { try { var c = cacheKey && localStorage.getItem(cacheKey); return c ? JSON.parse(c) : null; } catch (e) { return null; } }
  function withKeys(x) { x.id = packed.id; x.u = packed.u; x.t = packed.t === 'menu' ? 'menu' : x.t; return x; }
  var cached = fromCache();
  render(cached ? withKeys(cached) : packed);
  if (packed && packed.id && LIVE.test(String(packed.u || ''))) {
    var done = false, timer = setTimeout(function () { if (!done) { done = true; state.failed = true; if (!cached && packed.t === 'menu' && !packed.c) render(packed); } }, 15000);
    fetch(packed.u + '?page=guest&t=' + (packed.t === 'menu' ? 'menu' : 'info') + '&c=' + encodeURIComponent(packed.id), { redirect: 'follow' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (done && !(j && j.ok)) return; clearTimeout(timer); done = true;
        if (!j || !j.ok || !j.d) throw new Error('no data');
        try { localStorage.setItem(cacheKey, JSON.stringify(j.d)); } catch (e) { /* private mode */ }
        if (JSON.stringify(j.d) !== JSON.stringify(cached)) render(withKeys(j.d));
      })
      .catch(function () { clearTimeout(timer); done = true; state.failed = true; if (!cached && packed.t === 'menu' && !packed.c) render(packed); });
  }
  function render(d) {
    var app = document.getElementById('app');
    if (!d) { app.innerHTML = '<div class="empty"><div class="mono" style="margin-bottom:16px">A</div>Please scan the QR code in your room to see the Wi-Fi, house information and menu.</div>'; return; }
    if (d.t === 'menu' && !d.c) { app.innerHTML = '<div class="hero"><div class="mono">' + esc(String(d.n || 'A').trim().charAt(0)) + '</div><small>Food menu</small><h1>' + esc(d.n) + '</h1></div><main><div class="card" style="text-align:center">' +
      (state.failed ? 'The menu could not load right now.' + (digits(d.ph) ? '<div class="btns" style="margin-top:14px"><a class="btn" href="tel:+' + digits(d.ph) + '">' + ic('phone') + 'Call</a><a class="btn wa" href="https://wa.me/' + digits(d.ph) + '">' + ic('wa') + 'WhatsApp</a></div>' : '') : 'Loading the menu…') + '</div></main>'; return; }
    document.title = (d.t === 'menu' ? 'Menu · ' : 'Welcome · ') + (d.n || '');
    d.m = safeUrl(d.m); d.rv = safeUrl(d.rv);
    var wa = digits(d.ph), html = '<div class="hero"><div class="mono">' + esc(String(d.n || 'A').trim().charAt(0)) + '</div><small>' + (d.t === 'menu' ? 'Food menu' : 'Welcome to') + '</small><h1>' + esc(d.n) + '</h1>' + (d.w ? '<p>' + esc(d.w) + '</p>' : '') + '</div><main>';

    if (d.t === 'menu') {
      var cart = {};
      html += '<div class="card"><h2>' + ic('food') + 'Menu</h2><p style="margin:0;color:var(--muted);font-size:14px">Tap + to choose, then send your order on WhatsApp. Prices in rupees' + (d.g ? '; ' + esc(d.g) : '') + '.</p>' +
        (d.c || []).map(function (cat, ci) {
          return '<div class="cat">' + esc(cat[0]) + '</div>' + (cat[1] || []).map(function (it, ii) {
            return '<div class="item"><div class="nm">' + esc(it[0]) + '</div><div class="pr">' + (it[1] ? inr(it[1]) : '') + '</div>' + (wa ? '<div class="qty" data-k="' + ci + '_' + ii + '"><button type="button" data-d="-1" aria-label="Less">−</button><b>0</b><button type="button" data-d="1" aria-label="More">+</button></div>' : '') + '</div>';
          }).join('');
        }).join('') + '</div>';
      if (wa) html += '<div class="order hide" id="order"><div><b id="otot"></b><small id="ocnt"></small></div><input id="oroom" placeholder="Room" aria-label="Your room"><button class="btn wa" id="osend" style="min-height:42px;padding:0 14px">' + ic('wa') + 'Order</button></div>';
      html += '<p class="foot">' + esc(d.n) + (d.ph ? ' · ' + esc(d.ph) : '') + '</p></main>';
      app.innerHTML = html;
      function item(k) { var p = k.split('_'); return d.c[+p[0]][1][+p[1]]; }
      function draw() {
        var keys = Object.keys(cart).filter(function (k) { return cart[k] > 0; }), tot = 0, n = 0;
        keys.forEach(function (k) { tot += cart[k] * (item(k)[1] || 0); n += cart[k]; });
        var o = document.getElementById('order'); if (!o) return;
        o.classList.toggle('hide', !n); document.getElementById('otot').textContent = inr(tot); document.getElementById('ocnt').textContent = n + ' item' + (n === 1 ? '' : 's');
      }
      Array.prototype.forEach.call(document.querySelectorAll('.qty'), function (q) {
        Array.prototype.forEach.call(q.querySelectorAll('button'), function (b) {
          b.onclick = function () { var k = q.dataset.k; cart[k] = Math.max(0, (cart[k] || 0) + Number(b.dataset.d)); q.querySelector('b').textContent = cart[k]; draw(); };
        });
      });
      var os = document.getElementById('osend');
      if (os) os.onclick = function () {
        var room = document.getElementById('oroom').value.trim(), lines = [], tot = 0;
        Object.keys(cart).forEach(function (k) { if (cart[k] > 0) { var it = item(k), v = cart[k] * (it[1] || 0); tot += v; lines.push(cart[k] + ' × ' + it[0] + (it[1] ? ' (' + inr(v) + ')' : '')); } });
        var text = 'Namaste, food order' + (room ? ' for room ' + room : '') + ':\n' + lines.join('\n') + '\nTotal ' + inr(tot);
        location.href = 'https://wa.me/' + wa + '?text=' + encodeURIComponent(text);
      };
      return;
    }

    if (d.ws) {
      html += '<div class="card"><h2>' + ic('wifi') + 'Wi-Fi</h2><div class="kv"><span>Network</span><b>' + esc(d.ws) + '</b></div>' +
        (d.wp ? '<div style="color:var(--muted);font-size:13px;margin-top:8px">Password</div><div class="wifi-pass">' + esc(d.wp) + '</div><div class="btns"><button class="btn primary full" id="cpw">' + ic('copy') + 'Copy password</button></div>' : '<div class="kv"><span>Password</span><b>None</b></div>') + '</div>';
    }
    if (d.ci || d.co) html += '<div class="card"><h2>' + ic('clock') + 'Timings</h2><div class="times">' + (d.ci ? '<div class="time"><small>Check-in</small><b>' + esc(d.ci) + '</b></div>' : '') + (d.co ? '<div class="time"><small>Check-out</small><b>' + esc(d.co) + '</b></div>' : '') + '</div>' +
      (d.b ? '<div class="kv" style="margin-top:10px;border-top:1px solid var(--line)"><span>Breakfast</span><b>' + esc(d.b) + '</b></div>' : '') + '</div>';
    if (wa) html += '<div class="card"><h2>' + ic('phone') + 'Need anything?</h2><p style="margin:0 0 12px;color:var(--muted);font-size:14.5px">We are a call or message away, any time.</p><div class="btns"><a class="btn" href="tel:+' + wa + '">' + ic('phone') + 'Call</a><a class="btn wa" href="https://wa.me/' + wa + '">' + ic('wa') + 'WhatsApp</a></div></div>';
    if (d.r && d.r.length) html += '<div class="card"><h2>' + ic('list') + 'House rules</h2><ol class="rules">' + d.r.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ol></div>';
    if (d.x) html += '<div class="card"><h2>' + ic('info') + 'Good to know</h2><div class="note">' + esc(d.x) + '</div></div>';
    if (d.m || d.rv) html += '<div class="card btns">' + (d.m ? '<a class="btn' + (d.rv ? '' : ' full') + '" href="' + esc(d.m) + '" target="_blank" rel="noopener">' + ic('pin') + 'Location</a>' : '') + (d.rv ? '<a class="btn primary' + (d.m ? '' : ' full') + '" href="' + esc(d.rv) + '" target="_blank" rel="noopener">' + ic('star') + 'Review us</a>' : '') + '</div>';
    html += '<p class="foot">' + esc(d.n) + (d.ph ? ' · ' + esc(d.ph) : '') + '<br>Thank you for staying with us.</p></main>';
    app.innerHTML = html;
    var cp = document.getElementById('cpw'); if (cp) cp.onclick = function () { copy(d.wp, 'Password copied'); };
  }
})();
</script>
</body>
</html>
